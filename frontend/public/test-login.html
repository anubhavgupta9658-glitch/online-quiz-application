<!DOCTYPE html>
<html>
<head>
    <title>Login API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
        }
        textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login API Test</h1>
        
        <div>
            <label>Email:</label>
            <input type="email" id="email" value="user@test.com" />
        </div>
        
        <div>
            <label>Password:</label>
            <input type="password" id="password" value="password" />
        </div>
        
        <button onclick="testLogin()">Test Login</button>
        
        <h3>Response:</h3>
        <textarea id="response" readonly></textarea>
    </div>

    <script>
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const responseEl = document.getElementById('response');
            
            try {
                responseEl.value = 'Sending request...\n';
                responseEl.className = '';
                
                console.log('Fetching from:', 'http://localhost:5000/api/auth/login');
                
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    responseEl.className = 'success';
                    responseEl.value = 'SUCCESS:\n\n' + JSON.stringify(data, null, 2);
                    console.log('Login successful:', data);
                } else {
                    responseEl.className = 'error';
                    responseEl.value = 'ERROR (HTTP ' + response.status + '):\n\n' + JSON.stringify(data, null, 2);
                    console.error('Login failed:', data);
                }
            } catch (error) {
                responseEl.className = 'error';
                responseEl.value = 'NETWORK ERROR:\n\n' + error.toString() + '\n\nStack:\n' + error.stack;
                console.error('Network error:', error);
            }
        }
        
        // Test on page load
        window.onload = function() {
            console.log('Page loaded. Open browser DevTools console to see more details.');
        };
    </script>
</body>
</html>
